<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="{{ config.static.url }}css/xterm.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto%20Mono"
    />
    <script src="{{ config.static.url }}js/textual.js"></script>
    <style>
      body {
        background: #0c181f;
      }

      .dialog-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: var(--shadow-elevation-high);
      }
      .shade {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #0c181f;
        background-image: url("{{ config.static.url }}images/background.png");
      }
      .intro {
        width: 640px;
        height: 240px;
        font-size: 16px;
        z-index: 20;
        font-family: "Roboto Mono", menlo, monospace;
        text-align: center;
        opacity: 1;
        color: rgba(255, 255, 255, 0.95);
        background-color: #12232d;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 32px;
      }

      body.-first-byte .intro-dialog,
      body.-first-byte .intro-dialog .shade {
        opacity: 0;
        transition: opacity 0.3s ease-out;
        display: none;
      }

      body .textual-terminal {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      body.-first-byte .textual-terminal {
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }

      .intro svg {
        padding-right: 16px;
      }

      body Button {
        padding: 16px 32px;
        background-color: #5e0ba7;
        color: rgba(255, 255, 255, 0.95);
        border: none;
        font-family: "Roboto Mono", menlo, monospace;
        margin: 16px;
        display: block;
      }

      Button:hover {
        background: #ac5af4;
        cursor: pointer;
      }

      .closed-dialog {
        opacity: 0;
        display: none;
      }

      body.-closed .closed-dialog {
        opacity: 1;
        display: flex;
      }

      #start {
        display: none;
      }

      #start.-delay {
        display: flex;
      }
    </style>
    <script>
      function getStartUrl() {
        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        params.delete("delay");
        return url.pathname + "?" + params.toString();
      }
      async function refresh() {
        const ping_url = document.body.dataset.pingurl;
        if (ping_url) {
          await fetch(ping_url, {
            method: "GET",
            mode: "no-cors",
          });
        }
        window.location.href = getStartUrl();
      }
    </script>
  </head>
  <body data-pingurl="{{ ping_url }}">
    <div class="dialog-container intro-dialog">
      <div class="shade"></div>
      <div class="intro">
        <svg
          width="32px"
          viewBox="0 0 2933 2261"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M2927.81 0H1677.1L1312.35 205.173H306.689L0.359375 434.921L204.029 893.177H735.972L644.784 2261H1060.36L1441.72 1974.97L2073.92 688.003H2334.4L2717.9 472.286L2927.81 0ZM1245.82 410.347L1276.32 277.656H330.85L153.929 410.347H1245.82ZM1229.16 482.83H100.972L251.134 820.694H813.449L722.26 2188.52H837.043L1229.16 482.83ZM1350.7 277.656L911.417 2188.52H1023.87L1662.19 615.52H2301.36L2451.52 277.656H1350.7ZM1460.19 205.173H2497.79L2733.69 72.4829H1696.09L1460.19 205.173Z"
            fill="#ffffff"
          />
        </svg>

        <div>{{ application.name or 'Textual Application' }}</div>
        <button type="button" onClick="refresh()" id="start">Start</button>
      </div>
    </div>

    <div class="dialog-container closed-dialog">
      <div class="shade"></div>
      <div class="intro">
        <div class="message">Session ended.</div>
        <button type="button" onClick="refresh()">Restart</button>
      </div>
    </div>

    <div
      id="terminal"
      class="textual-terminal"
      data-session-websocket-url="{{ app_websocket_url }}"
      data-font-size="{{ font_size }}"
    ></div>

    <!-- Stakey: swipe to scroll on a phone. Added to textual-serve 1.1.3's own
         page (the rest of this file is unchanged). xterm.js ignores touchmove
         whenever the app has mouse reporting on -- which a Textual app always
         does -- so a swipe did nothing. Translate the swipe into wheel events
         at the finger's position; xterm forwards those to the app as mouse-wheel
         reports, so whichever panel is under the finger scrolls. A tap (no
         movement) is left alone so tabs and rows can still be tapped. -->
    <script>
      (function () {
        const TAP_SLOP = 8; // px of movement before a touch counts as a swipe
        // Textual scrolls ~3 lines per wheel tick, so one tick per 3 rows of
        // finger travel keeps the content moving with the finger.
        const ROWS_PER_TICK = 3;
        let lastY = null, startX = 0, startY = 0, acc = 0, swiping = false;

        function rowHeight() {
          // xterm sizes its hidden input textarea to exactly one cell.
          const t = document.querySelector(".xterm-helper-textarea");
          const h = t && parseFloat(t.style.height);
          return h > 4 ? h : 20;
        }
        function wheel(target, x, y, lines) {
          target.dispatchEvent(new WheelEvent("wheel", {
            deltaY: lines, deltaMode: WheelEvent.DOM_DELTA_LINE,
            clientX: x, clientY: y, bubbles: true, cancelable: true,
          }));
        }

        document.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { lastY = null; return; }
          const t = e.touches[0];
          startX = t.clientX; startY = t.clientY; lastY = t.clientY;
          acc = 0; swiping = false;
        }, { passive: true, capture: true });

        document.addEventListener("touchmove", (e) => {
          if (lastY === null || e.touches.length !== 1) return;
          const t = e.touches[0];
          if (!swiping) {
            const dx = Math.abs(t.clientX - startX), dy = Math.abs(t.clientY - startY);
            if (dx < TAP_SLOP && dy < TAP_SLOP) return;
            // Mostly sideways: leave it to the browser (pans a zoomed-in page).
            if (dx > dy) { lastY = null; return; }
            swiping = true;
          }
          e.preventDefault();
          e.stopPropagation();
          acc += lastY - t.clientY; // finger up => scroll content down
          lastY = t.clientY;
          const step = rowHeight() * ROWS_PER_TICK;
          const target = document.elementFromPoint(startX, startY);
          if (!target) return;
          while (Math.abs(acc) >= step) {
            const dir = acc > 0 ? 1 : -1;
            wheel(target, startX, startY, dir);
            acc -= dir * step;
          }
        }, { passive: false, capture: true });

        document.addEventListener("touchend", () => { lastY = null; },
                                  { passive: true, capture: true });
      })();
    </script>
  </body>
</html>
